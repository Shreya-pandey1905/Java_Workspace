<!DOCTYPE html>
<html lang="en" xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>
<div th:if="${success}">
  <h3 style="color: green" th:text="${success}"></h3>
</div>
<div th:if="${error}">
  <h3 style="color: red" th:text="${error}"></h3>
</div>

 <form th:action="@{/addUser}"
 th:object="${users}" method="post">

   <input type="text" th:field="*{name}" placeholder="Enter the name">
   <br> <br>
   <input type="email" th:field="*{email}" placeholder="Enter the email">
   <br> <br>
   <input type="password" th:field="*{password}" placeholder="Enter the password">
   <br> <br>
   <input type="number" th:field="*{phone}" placeholder="Enter the phone">
   <br> <br>

   <input type="submit" value="Register">



 </form>
 <br> <br>
</body>

</html>
