<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="img1" src="img.jpg" alt="This is the image" onmouseover="setNewImg()" onmouseout="getBacktoOldImage()">
   
</body>

<script>
    function setNewImg(){
            document.getElementById("img1").src="thomas.jpg"
    }
    function getBacktoOldImage(){
        document.getElementById("img1").src="img.jpg"
    }
</script>
</html>
