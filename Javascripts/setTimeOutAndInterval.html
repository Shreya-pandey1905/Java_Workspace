<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<h1 id="h1">WORKING!!!!</h1>

<body>
    <script>
        
        // setTimeout(function(){
        //                 document.getElementById("h1").innerHTML="Sleeping";

        // },5000);

        let seconds = 0;
        setInterval(function () {
            seconds++;
            if (seconds <= 10) {
                document.getElementById("h1").innerHTML = "Seconds: " + seconds;

            } else {
                document.getElementById("h1").innerHTML = "Stop!!!!";
            }

        }, 1000)


    </script>
</body>

</html>
