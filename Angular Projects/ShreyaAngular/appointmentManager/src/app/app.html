<h1>Appointment Manager</h1>

    <p>Add and manage your Appointments</p>
 <form id="appointmentForm">
    <h2>Add new Appointment</h2>
    <label>
      Appointment date
    </label>

    <input type="text"
    
    placeholder="Enter Appointment description"
    [value]="newAppointmentTitle()"
    (input)="newAppointmentTitle.set($event.target.value)"
    >

    <br><br>

    <label>
      Appointment Date
    </label>

    <input type="date"
    id="date"
    (input)="newAppointmentDate.set($any($event.target).value)"
    required
    >

    <br> <br>

    <button (click)="addAppointment()">Add Appointment</button>

   </form>

   <h2>My Appointments</h2>

   @if (appointments().length===0) {
    <p class="empty-message">No appointments available</p>
   }

   @for (appointment of appointments(); track appointment.id) {
    <div class="appointment-card">
      <div class="appointment-info">
        <h3>{{ appointment.title}}</h3>
        <p>{{appointment.date}}</p>
      </div>

      <button class="delete-btn"
      (click)="deleteAppointment(appointment.id)">
      Delete

      </button>

    </div>
   }
