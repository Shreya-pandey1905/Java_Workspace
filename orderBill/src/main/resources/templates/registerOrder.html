<!DOCTYPE html>
<html lang="en" xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>


 <form th:action="@{/addOrder}"
 th:object="${order}" method="post">

   <input type="text" th:field="*{itemName}" placeholder="Enter the item Name">
   <br> <br>
   <input type="number" th:field="*{price}" placeholder="Enter the price">
   <br> <br>
   <input type="number" th:field="*{orderQuantity}" placeholder="Enter the order Quantity">
   <br> <br>
     <div>
         <label>Paid or Not:</label>

         <label>
             <input type="radio"
                    th:field="*{paidOrNot}"
                    value="Yes">
             Yes
         </label>

         <label>
             <input type="radio"
                    th:field="*{paidOrNot}"
                    value="No">
             No
         </label>
     </div>   <br> <br>

   <input type="submit" value="Register">



 </form>
 <br> <br>
</body>

</html>
