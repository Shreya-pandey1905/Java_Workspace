<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        .form-container {
        width: 450px;
        margin: 40px auto;
        padding: 30px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        font-family: Arial, sans-serif;
    }

    .form-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #343a40;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #333;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
    }

    .form-group input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
    }

    .error {
        color: red;
        font-size: 13px;
        margin-top: 5px;
    }

    .button-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
    }

    .submit-btn {
        padding: 10px 22px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .submit-btn:hover {
        background-color: #0056b3;
    }

    .employee-btn {
        padding: 10px 18px;
        border-radius: 5px;
        background-color: #343a40;
        color: white;
        text-decoration: none;
        font-size: 15px;
    }

    .employee-btn:hover {
        background-color: #212529;
    }</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h2>Employee Registration</h2>

<form th:action="@{/employees/save}" th:object="${employees}" method="post">
    <div class="form-container">


        <div class="form-group">
            <label>Name:</label>
            <input type="text" th:field="*{name}" placeholder="Enter your name">

            <div class="error"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>


        <div class="form-group">
            <label>Email:</label>
            <input type="text" th:field="*{email}" placeholder="Enter your email">

            <div class="error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>


        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" placeholder="Enter your password">

            <div class="error"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>
        </div>


        <div class="form-group">
            <label>Phone:</label>
            <input type="text" th:field="*{phoneNumber}" placeholder="Enter phone number">

            <div class="error"
                 th:if="${#fields.hasErrors('phoneNumber')}"
                 th:errors="*{phoneNumber}">
            </div>
        </div>


        <div class="form-group">
            <label>Age:</label>
            <input type="text" th:field="*{age}" placeholder="Enter age">

            <div class="error"
                 th:if="${#fields.hasErrors('age')}"
                 th:errors="*{age}">
            </div>
        </div>


        <div class="form-group">
            <label>Salary:</label>
            <input type="text" th:field="*{salary}" placeholder="Enter salary">

            <div class="error"
                 th:if="${#fields.hasErrors('salary')}"
                 th:errors="*{salary}">
            </div>
        </div>


        <div class="form-group">
            <label>Department:</label>
            <input type="text" th:field="*{department}" placeholder="Enter department">

            <div class="error"
                 th:if="${#fields.hasErrors('department')}"
                 th:errors="*{department}">
            </div>
        </div>


        <div class="button-group">
            <input type="submit" value="Submit" class="submit-btn">

            <a href="/employees" class="employee-btn">
                View Employees
            </a>
        </div>

    </div>
</form>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
