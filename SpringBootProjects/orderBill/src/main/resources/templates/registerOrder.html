<!DOCTYPE html>
<html lang="en" xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>


<form th:action="@{/addOrder}"
      th:object="${order}" method="post">


    <label for="itemName">Item Name:</label>
    <input type="text" id="itemName" th:field="*{itemName}" placeholder="Enter the item name">
    <br><br>

    <label for="price">Price:</label>
    <input type="number" id="price" th:field="*{price}" placeholder="Enter the price">
    <br><br>

    <label for="orderQuantity">Order Quantity:</label>
    <input type="number" id="orderQuantity" th:field="*{orderQuantity}" placeholder="Enter the order quantity">
    <br><br>


    <div>
        <label>Paid or Not:</label>

        <label>
            <input type="radio"
                   th:field="*{paidOrNot}"
                   value="Yes">
            Yes
        </label>

        <label>
            <input type="radio"
                   th:field="*{paidOrNot}"
                   value="No">
            No
        </label>
    </div>   <br> <br>

    <input type="submit" value="Register">



</form>
<br> <br>
</body>

</html>
